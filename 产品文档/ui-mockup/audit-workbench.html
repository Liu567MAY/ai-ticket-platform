<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学分置换 AI 审核协同平台 · 老师审核工作台</title>
<style>
/* ================= Design Tokens — 高校行政 + AI 审核 ================= */
:root{
  --bg:#F5F6F8;
  --panel:#FFFFFF;
  --panel-2:#F8F9FB;
  --line:#E4E7EB;
  --line-strong:#D3D8DE;
  --ink:#1F2328;
  --ink-2:#5A6167;
  --ink-3:#6B7178;
  --blue:#24518F; --blue-hover:#1D4376; --blue-bg:#EEF3FA; --blue-line:#C6D6EA;
  --green:#1F7A4D; --green-bg:#E9F3EE;
  --red:#C13A2B; --red-bg:#FAEDEB;
  --orange:#C2610E; --orange-text:#A34E08; --orange-bg:#FCF3E7; --orange-line:#EBD3AE;
  --gray-st:#5A6472; --gray-bg:#F0F2F4;
  --radius:6px; --radius-lg:8px;
  --shadow-sm:0 1px 2px rgba(16,24,32,.05);
  --shadow-md:0 6px 20px rgba(16,24,32,.12);
  --font:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  --mono:Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.6;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
::selection{background:#CFE0F2;color:var(--ink)}
input,button,textarea{font-family:inherit}
button{cursor:pointer;background:none;border:none;color:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#CBD1D8;border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ================= 状态灯 ================= */
.lamp{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:none}
.lamp-green{background:var(--green)} .lamp-red{background:var(--red)}
.lamp-orange{background:var(--orange)} .lamp-gray{background:var(--gray-st)}
.lamp-blue{background:var(--blue)}
.lamp-hollow{background:transparent;border:1.5px solid var(--line-strong)}
.lamp-blink{animation:blink 1.1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.lamp-blink{animation:none}*{transition:none!important}}

/* ================= 顶栏 ================= */
.app-topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:26px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{display:flex;align-items:center;gap:4px;padding:7px 9px;background:var(--blue-bg);border:1px solid var(--blue-line);border-radius:6px}
.brand-mark .lamp{width:5px;height:5px}
.brand-name{font-size:15px;font-weight:600}
.topnav{display:flex;gap:2px;flex:1}
.topnav a{text-decoration:none;color:var(--ink-2);font-size:13px;padding:6px 14px;border-radius:5px}
.topnav a:hover{color:var(--ink);background:var(--panel-2)}
.topnav a.on{color:var(--blue);background:var(--blue-bg);font-weight:600}
.topbar-right{display:flex;align-items:center;gap:12px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.topbar-user{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid var(--line)}
.topbar-user .u-name{font-size:13px;font-weight:600;line-height:1.25}
.topbar-user .u-role{font-size:12px;color:var(--ink-3);line-height:1.25}

/* ================= 三栏工作台 280 / 1fr / 420 ================= */
.wb{display:grid;grid-template-columns:280px minmax(0,1fr) 420px;gap:12px;padding:14px 16px 24px;height:calc(100vh - 56px)}
.col{min-height:0;display:flex;flex-direction:column;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;min-height:0;flex:1}
.panel-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex:none}
.panel-head h2{font-size:14px;font-weight:600}
.panel-body{flex:1;overflow-y:auto;min-height:0}
.panel-foot{border-top:1px solid var(--line);padding:12px 16px;flex:none}

/* ================= 左栏：文件夹树 ================= */
.tree-search{display:flex;align-items:center;gap:8px;margin:10px 12px 4px;border:1px solid var(--line-strong);border-radius:var(--radius);height:32px;padding:0 10px;color:var(--ink-3)}
.tree-search input{border:none;outline:none;flex:1;font-size:12.5px;background:transparent;color:var(--ink)}
.tree-search input::placeholder{color:var(--ink-3)}
.tree{padding:6px 8px 14px}
.t-row{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:5px 8px;border-radius:5px;font-size:13px;color:var(--ink)}
.t-row:hover{background:var(--panel-2)}
.t-chev{width:14px;height:14px;color:var(--ink-3);flex:none;transition:transform .15s}
.t-chev.open{transform:rotate(90deg)}
.t-count{margin-left:auto;font-size:12px;color:var(--ink-3)}
.t-group{padding-left:8px}
.t-group .t-label{display:flex;align-items:center;gap:7px}
.t-leaf{padding-left:34px}
.t-leaf .t-label{display:flex;align-items:center;gap:7px;color:var(--ink-2)}
.t-leaf .t-date{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3);font-weight:400}
.t-row.sel{background:var(--blue-bg);color:var(--blue);font-weight:600}
.t-row.sel .t-label{color:var(--blue)}
.t-sub{display:none}
.t-sub.open{display:block}
.t-empty{font-size:12px;color:var(--ink-3);padding:14px;display:none}

/* ================= 中栏：申请详情 ================= */
.dt-pad{padding:16px 20px 20px}
.dt-title-row{display:flex;align-items:flex-start;gap:12px}
.dt-title-row h1{font-size:18px;font-weight:600;line-height:1.4;flex:1}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;flex:none;white-space:nowrap}
.st-blue{background:var(--blue-bg);color:var(--blue)}
.st-orange{background:var(--orange-bg);color:var(--orange-text)}
.st-green{background:var(--green-bg);color:var(--green)}
.st-red{background:var(--red-bg);color:var(--red)}
.st-gray{background:var(--gray-bg);color:var(--gray-st)}
.meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:14px 0 0}
.meta-cell{background:var(--panel-2);padding:8px 12px}
.meta-k{font-size:12px;color:var(--ink-3)}
.meta-v{font-size:13px;font-weight:500}
.more-toggle{margin-top:10px;font-size:12.5px;color:var(--blue);font-weight:600;display:flex;align-items:center;gap:5px}
.more-toggle:hover{text-decoration:underline}
.more-box{display:none;margin-top:10px;border:1px dashed var(--line-strong);border-radius:6px;padding:12px 14px}
.more-box.open{display:block}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:12.5px;color:var(--ink-2)}
.more-grid b{color:var(--ink);font-weight:500}
.sec{margin-top:20px}
.sec-h{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec-h .sec-n{font-size:12px;font-weight:500;color:var(--ink-3)}
.file-list{margin-top:10px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.file-row{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--panel);width:100%;text-align:left}
.file-row + .file-row{border-top:1px solid var(--line)}
.file-row:hover{background:var(--panel-2)}
.file-ico{width:30px;height:34px;border-radius:4px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.file-main{flex:1;min-width:0}
.file-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.file-sub{font-size:12px;color:var(--ink-3)}
.file-st{display:flex;align-items:center;gap:6px;font-size:12px;flex:none}
.file-st.ok{color:var(--green)} .file-st.bad{color:var(--red)} .file-st.idle{color:var(--ink-3)}
.file-missing{display:flex;align-items:center;gap:10px;padding:9px 13px;border-top:1px dashed var(--orange-line);background:var(--orange-bg)}
.fm-dot{width:8px;height:8px;border-radius:50%;background:var(--orange);flex:none}
.fm-name{font-size:13px;color:var(--orange-text)}
.fm-note{margin-left:auto;font-size:12px;color:var(--orange-text)}

/* ================= 右栏：AI 审核结果 ================= */
.run-tag{margin-left:auto;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:10px}
.link-btn{color:var(--blue);font-weight:600;font-size:12px}
.link-btn:hover{text-decoration:underline}
.rp-pad{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.banner{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:6px}
.banner .b-main{font-size:14px;font-weight:600}
.banner .b-sub{font-size:12px;font-weight:400;margin-top:2px}
.banner.orange{background:var(--orange-bg);color:var(--orange-text)}
.banner.red{background:var(--red-bg);color:var(--red)}
.banner.green{background:var(--green-bg);color:var(--green)}
.banner.gray{background:var(--gray-bg);color:var(--gray-st)}
.banner.red .b-sub,.banner.green .b-sub{color:var(--ink-2)}
.rp-sec h3{font-size:13px;font-weight:600;margin-bottom:8px}
.issue-list{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.issue-item{display:flex;gap:10px;padding:8px 12px;font-size:13px;background:var(--panel)}
.issue-item + .issue-item{border-top:1px solid var(--line)}
.issue-no{font-family:var(--mono);font-size:12px;color:var(--red);font-weight:600;flex:none;padding-top:1px}
.issue-none{padding:9px 12px;font-size:12.5px;color:var(--ink-3);background:var(--panel-2)}
.rule-list{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.rule-row{background:var(--panel)}
.rule-row + .rule-row{border-top:1px solid var(--line)}
.rule-btn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 12px}
.rule-btn:hover{background:var(--panel-2)}
.rule-code{font-family:var(--mono);font-size:12px;color:var(--ink-3);width:26px;flex:none}
.rule-name{font-size:13px;flex:1;min-width:0}
.rule-st{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;flex:none}
.rs-green{color:var(--green)} .rs-red{color:var(--red)} .rs-orange{color:var(--orange-text)} .rs-gray{color:var(--gray-st)}
.rule-chev{width:13px;height:13px;color:var(--ink-3);transition:transform .15s;flex:none}
.rule-row.open .rule-chev{transform:rotate(90deg)}
.rule-detail{display:none;padding:11px 13px 13px;background:var(--panel-2);border-top:1px solid var(--line)}
.rule-row.open .rule-detail{display:block}
.rd-grid{display:grid;grid-template-columns:52px 1fr;gap:5px 10px;font-size:12.5px}
.rd-k{color:var(--ink-3)}
.rd-v{color:var(--ink)}
.rd-v.quote{font-family:var(--mono);font-size:12px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 8px}
.rd-actions{display:flex;gap:8px;margin-top:11px;align-items:center}
.rd-modified{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--orange-text);background:var(--orange-bg);border:1px solid var(--orange-line);border-radius:4px;padding:1px 7px}
.edit-box{margin-top:11px;border:1px solid var(--blue-line);border-radius:6px;padding:11px;background:var(--panel)}
.edit-title{font-size:12.5px;font-weight:600;margin-bottom:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.seg button{border:1px solid var(--line-strong);border-radius:5px;padding:4px 12px;font-size:12.5px;color:var(--ink-2)}
.seg button.on{border-color:var(--blue);color:var(--blue);background:var(--blue-bg);font-weight:600}
.edit-box textarea{width:100%;border:1px solid var(--line-strong);border-radius:5px;padding:7px 9px;font-size:12.5px;min-height:52px;resize:vertical;color:var(--ink)}
.edit-box textarea:focus{outline:none;border-color:var(--blue)}
.btn-sm{height:30px;padding:0 14px;border-radius:5px;font-size:12.5px;font-weight:600}
.btn-sm.primary{background:var(--blue);color:#fff}
.btn-sm.primary:hover{background:var(--blue-hover)}
.btn-sm.ghost{border:1px solid var(--line-strong);color:var(--ink-2)}
.btn-sm.ghost:hover{color:var(--ink);border-color:var(--ink-3)}
.act-buttons{display:flex;gap:10px}
.btn-main{height:38px;padding:0 20px;border-radius:6px;font-size:13.5px;font-weight:600}
.btn-main.primary{background:var(--blue);color:#fff}
.btn-main.primary:hover{background:var(--blue-hover)}
.btn-main.warn{background:var(--orange);color:#fff}
.btn-main.warn:hover{background:var(--orange-text)}
.btn-main.ghost{border:1px solid var(--line-strong);color:var(--ink-2);background:var(--panel)}
.btn-main.ghost:hover{color:var(--ink);border-color:var(--ink-3)}
.btn-main.danger-ghost{border:1px solid var(--line-strong);color:var(--red)}
.btn-main.danger-ghost:hover{border-color:var(--red);background:var(--red-bg)}
.hist-row{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:var(--panel)}
.hist-row + .hist-row{margin-top:6px}
.hist-run{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.hist-res{margin-left:auto;font-weight:600}
.supplement-box{border:1px solid var(--orange-line);background:var(--orange-bg);border-radius:6px;padding:11px 13px}
.supplement-box h4{font-size:13px;color:var(--orange-text);margin-bottom:6px}
.supplement-box li{margin-left:18px;font-size:12.5px;color:var(--ink)}
.appr-meta{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.appr-meta div{background:var(--panel-2);padding:8px 12px;font-size:12.5px}
.appr-meta .k{color:var(--ink-3);font-size:12px}
.running-box{border:1px solid var(--blue-line);background:var(--blue-bg);border-radius:6px;padding:13px}
.running-line{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--blue);font-weight:600}
.running-sub{font-size:12.5px;color:var(--ink-2);margin-top:7px}

/* ================= 抽屉：Agent 执行详情 ================= */
.drawer-mask{position:fixed;inset:0;background:rgba(20,26,34,.4);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.drawer-mask.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:-460px;width:440px;height:100vh;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow-md);transition:right .2s ease-out;z-index:41;display:flex;flex-direction:column}
.drawer.open{right:0}
.drawer-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex:none}
.drawer-head h2{font-size:14px;font-weight:600}
.drawer-close{margin-left:auto;width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.drawer-close:hover{background:var(--panel-2);color:var(--ink)}
.drawer-note{margin:10px 18px 0;font-size:12px;color:var(--ink-3);background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:6px 10px}
.drawer-body{flex:1;overflow-y:auto;padding:14px 18px 20px}
.run-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--panel-2)}
.run-meta span{color:var(--ink-3)} .run-meta b{font-weight:600;color:var(--ink)}
.run-meta .full{grid-column:1/-1}
.wf{margin-top:14px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.wf-row{display:flex;align-items:center;gap:9px;min-height:36px;padding:7px 12px}
.wf-row + .wf-row{border-top:1px solid var(--panel-2)}
.wf-seq{font-family:var(--mono);font-size:12px;color:var(--ink-3);width:22px;flex:none}
.wf-tag{font-size:12px;font-weight:600;border-radius:4px;padding:0 7px;flex:none;line-height:18px}
.wf-tag.node{background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2)}
.wf-tag.tool{background:var(--blue-bg);border:1px solid var(--blue-line);color:var(--blue)}
.wf-tag.rule{background:var(--gray-bg);border:1px solid var(--line-strong);color:var(--gray-st)}
.wf-tag.int{background:var(--orange-bg);border:1px solid var(--orange-line);color:var(--orange-text)}
.wf-name{font-size:13px;font-weight:600;flex:none}
.wf-detail{font-family:var(--mono);font-size:12px;color:var(--ink-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wf-dur{font-family:var(--mono);font-size:12px;color:var(--ink-2);flex:none}

/* ================= 预览浮层 ================= */
.preview-mask{position:fixed;inset:0;background:rgba(20,26,34,.45);display:none;align-items:center;justify-content:center;z-index:50}
.preview-mask.open{display:flex}
.preview-card{width:620px;max-width:92vw;max-height:86vh;background:var(--panel);border-radius:10px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;overflow:hidden}
.preview-head{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.preview-head h3{font-size:13.5px;font-weight:600}
.preview-body{padding:22px;background:var(--gray-bg);overflow-y:auto;display:flex;justify-content:center}
.doc-page{width:460px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:30px 34px;box-shadow:var(--shadow-sm)}
.doc-title{text-align:center;font-size:15px;font-weight:600;margin-bottom:16px}
.doc-line{height:10px;border-radius:3px;background:#EEF0F2;margin-bottom:9px}
.doc-line.w60{width:60%} .doc-line.w80{width:80%} .doc-line.w90{width:90%}
.doc-stamp{margin:18px auto 0;width:86px;height:86px;border:2.5px solid #D9877C;border-radius:50%;opacity:.55;position:relative}
.doc-stamp::after{content:"单位公章";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#C13A2B}
.preview-foot{padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);text-align:center}

/* ================= 演示标注 & 提示 ================= */
.demo-tag{position:fixed;right:14px;bottom:14px;z-index:30;font-size:12px;color:var(--ink-3);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 12px;box-shadow:var(--shadow-sm)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:#23272B;color:#fff;font-size:13px;padding:8px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:all .2s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:1100px){
  .wb{grid-template-columns:minmax(0,1fr);height:auto}
  .wb .col{min-height:auto}
  .wb .col-tree .panel{max-height:340px}
  .brand-name{white-space:nowrap}
}
@media (max-width:820px){
  .topnav{display:none}
  .meta-grid{grid-template-columns:1fr 1fr}
  .topbar-user .u-role{display:none}
}
</style>
</head>
<body>

<!-- 顶栏 -->
<header class="app-topbar">
  <div class="brand">
    <span class="brand-mark" role="img" aria-label="平台标识：审核状态灯">
      <span class="lamp lamp-green"></span><span class="lamp lamp-green"></span>
      <span class="lamp lamp-green"></span><span class="lamp lamp-hollow"></span>
    </span>
    <span class="brand-name">学分置换审核平台</span>
  </div>
  <nav class="topnav" aria-label="主导航">
    <a href="#" class="on">工作台</a>
    <a href="#">申请管理</a>
    <a href="#">审核任务</a>
    <a href="#" id="nav-runs">Agent 运行记录</a>
  </nav>
  <div class="topbar-right">
    <div class="topbar-user">
      <span class="avatar">周</span>
      <span><span class="u-name">周老师</span><br><span class="u-role">REVIEWER · 教务处</span></span>
    </div>

/* ================= 工具函数 ================= */
const $ = s => document.querySelector(s);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}

function outcomeOf(app){
  const st = (app.rules||[]).map(r=>r.status);
  if(st.includes('NEED_SUPPLEMENT')) return {label:'需要补充材料', cls:'orange', sub:()=>issueListOf(app).length+' 项问题 · '+app.missing.length+' 项材料缺失 · '+st.filter(s=>s==='NEED_REVIEW').length+' 项需人工复核'};
  if(st.includes('FAIL')) return {label:'审核不通过', cls:'red', sub:()=>issueListOf(app).length+' 项问题'};
  if(st.includes('NEED_REVIEW')) return {label:'需人工复核', cls:'gray', sub:()=>'规则判定均通过，'+st.filter(s=>s==='NEED_REVIEW').length+' 项需人工确认'};
  return {label:'材料齐全，审核通过', cls:'green', sub:()=>'全部规则通过'};
}
function issueListOf(app){
  const list=[];
  (app.missing||[]).forEach(m=>list.push('缺少《'+m.replace(/\.[a-z]+$/i,'')+'》'));
  (app.rules||[]).forEach(r=>{
    if(r.status==='FAIL'&&r.problem) list.push(r.problem);
  });
  return [...new Set(list)];
}

function openRuleEdit(app,i){
  const r = app.rules[i];

    <div style="height:12px"></div>
    <div class="run-meta">${Object.entries(r.meta).map(([k,v])=>`<div class="${k==='Run ID'?'full':''}"><span>${esc(k)}　</span><b>${esc(v)}</b></div>`).join('')}</div>
    <div class="wf">${r.nodes.map((n,i)=>{const[c,l]=tag(n.t);return `
      <div class="wf-row"><span class="wf-seq">${String(i+1).padStart(2,'0')}</span>
      <span class="wf-tag ${c}">${l}</span><span class="wf-name">${esc(n.n)}</span>
      <span class="wf-detail">${esc(n.d)}</span>
      <span style="flex:none"><span class="lamp ${n.ok?'lamp-green':'lamp-blue lamp-blink'}"></span></span>
      <span class="wf-dur">${esc(n.dur)}</span></div>`}).join('')}
    </div>
    <div style="margin-top:12px;font-size:12px;color:var(--ink-3)">完整 Trace 与 Token 明细见「Agent 运行记录」页面（ADMIN 视角）。</div>`;
  $('#drawer').classList.add('open'); $('#drawer-mask').classList.add('open');
}
$('#drawer-close').addEventListener('click',closeDrawer);
$('#drawer-mask').addEventListener('click',closeDrawer);
function closeDrawer(){$('#drawer').classList.remove('open');$('#drawer-mask').classList.remove('open')}

/* ================= 材料预览 ================= */
function openPreview(f){
  $('#preview-title').textContent = '材料预览 — '+f.name;
  $('#preview-doc-title').textContent = f.name.replace(/\.[a-z]+$/i,'');
  $('#preview-stamp').style.display = /盖章|证明/.test(f.name)?'block':'none';
  $('#preview-mask').classList.add('open');
}
$('#preview-close').addEventListener('click',()=>$('#preview-mask').classList.remove('open'));
$('#preview-mask').addEventListener('click',e=>{if(e.target===e.currentTarget)$('#preview-mask').classList.remove('open')});

/* ================= 目录树（数据驱动，按流程节点分组；日期为叶子辅助信息） ================= */
const APP_DAY = {APP1:'09-29',APP2:'09-29',APP3:'09-29',APP4:'09-29',APP5:'09-29',APP6:'09-29',APP7:'09-28',APP8:'09-28'};
const GROUPS = [
  ['AI_AUDIT','待AI审核','lamp-blue'],
  ['REVIEW','待老师复核','lamp-orange'],
  ['SUPPLEMENT','待补材料','lamp-hollow'],
  ['FINAL','待最终审批','lamp-orange'],
  ['APPROVED','已通过','lamp-green'],
  ['REJECTED','已驳回','lamp-red']
];
const openS = new Set(GROUPS.map(g=>g[0]));
function renderTree(q){
  q = (q||'').trim().toLowerCase();
  let visible = 0;
  $('#tree').innerHTML = GROUPS.map(([st,label,dot])=>{
    const ids = Object.keys(APPS).filter(id=>APPS[id].status===st)
      .filter(id=>{const a=APPS[id];return !q||a.name.includes(q)||a.no.toLowerCase().includes(q)});
    if(!ids.length) return '';
    visible += ids.length;
    const sOpen = openS.has(st);
    return `<div class="t-row t-group" data-s="${st}"><svg class="t-chev ${sOpen?'open':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg><span class="t-label"><span class="lamp ${dot}"></span>${label}</span><span class="t-count">${ids.length}</span></div>
      <div class="t-sub ${sOpen?'open':''}">${ids.map(id=>{const a=APPS[id];return `<button class="t-row t-leaf ${id===currentApp?'sel':''}" data-app="${id}"><span class="t-label"><span class="lamp ${SM[a.status].dot}"></span>${esc(a.name)}</span><span class="t-date">${APP_DAY[id]}</span></button>`}).join('')}</div>`;
  }).join('');
  $('#tree-empty').style.display = visible?'none':'block';
  $('#tree').querySelectorAll('.t-group').forEach(r=>r.addEventListener('click',()=>{
    const k=r.dataset.s; openS.has(k)?openS.delete(k):openS.add(k); renderTree($('#tree-search').value);
  }));
  $('#tree').querySelectorAll('.t-leaf').forEach(l=>l.addEventListener('click',()=>{
    currentApp = l.dataset.app; refreshAll();
  }));
}
$('#tree-search').addEventListener('input',e=>renderTree(e.target.value));
$('#nav-runs').addEventListener('click',e=>{e.preventDefault();const app=APPS[currentApp];if(app.run)openDrawer(app)});

/* ================= 刷新 ================= */
function refreshAll(){
  const app = APPS[currentApp];
  renderTree($('#tree-search').value);
  renderDetail(app); renderRight(app);
}
refreshAll();
</script>
</body>
